name: ci

on:
  push:
    branches: [ "test_1" ]
  pull_request:
    branches: [ "test_1" ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run:
        cd API-Getway
        make server

